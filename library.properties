sentence=Easy MPU6050 / MPU6500 / MPU9250 (GY-521) library: acceleration, rotation, tilt angles with a filter, calibration. No dependencies.
paragraph=Reads the accelerometer and gyroscope over I2C with a one-line begin(): finds the address and the chip itself, gives accelX(), gyroZ(), roll(), pitch(), yaw() and tilt() with a complementary filter, calibrates the zero offsets, and explains wiring problems in Russian, Kazakh or English. Works on Arduino AVR, ESP32, ESP8266 and other boards with only the built-in Wire library. Examples included, made for classes and kits by Alash Electronics.
